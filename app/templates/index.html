<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ミニ掲示板</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css')}}"
    />
  </head>
  <body>
    <div class="container">
      <h1>ミニ掲示板</h1>

      <!-- メッセージを入力して送信するフォーム-->
      <form method="POST">
        <input type="text" name="message" placeholder="今何してる？" required />
        <button type="submit">書き込む</button>
      </form>

      <h3>投稿一覧</h3>
      <ul>
        <!--Pythonから渡された rows（投稿のリスト）をループでぐるぐる回して表示する -->
        {% for row in rows%}
        <li>{{ row[0] }}</li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
