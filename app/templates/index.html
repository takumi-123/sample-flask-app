<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプル掲示板</title>
    <!-- CSSの読み込み -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <button id="dark-mode-btn">🌙 ダークモード切替</button>
      <h1>💬 掲示板アプリ</h1>

      <!-- 検索フォーム -->
      <form action="/" method="GET" class="search-form">
        <input
          type="text"
          name="keyword"
          placeholder="キーワードで検索..."
          class="search-input"
        />
        <button type="submit" class="search-btn">検索</button>
        <a href="/" class="reset-btn">リセット</a>
      </form>

      <!-- 投稿フォーム（文字数カウンター付き） -->
      <form action="/" method="POST" class="post-form">
        <textarea
          name="message"
          id="message-input"
          placeholder="いまどうしてる？メッセージを入力..."
          rows="3"
          class="post-input"
          required
        ></textarea>

        <div class="counter-container">
          <span id="char-count">0</span> / 140文字
        </div>

        <button type="submit">投稿する</button>
      </form>

      <!-- 投稿一覧 -->
      <div class="message-list">
        <h2>投稿一覧</h2>
        {% if rows %}
        <ul>
          {% for row in rows %}
          <li class="message-card">
            <span>{{ row[1] }}</span>
            <!-- いいねボタン-->
            <form
              action="/like/{{ row[0] }}"
              method="POST"
              style="display: inline"
            >
              <button type="submit" class="like-btn" style="margin-left: 10px">
                ❤️ いいね ({{ row[2] }})
              </button>
            </form>
            <!-- 編集ボタン-->
            <a
              href="/edit/{{ row[0] }}"
              class="edit-btn"
              style="margin-right: 5px"
              >編集</a
            >
            <!-- 削除ボタン -->
            <form
              action="/delete/{{ row[0] }}"
              method="POST"
              style="display: inline"
            >
              <button type="submit" class="delete-btn">削除</button>
            </form>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="no-message">
          まだ投稿はありません。最初のメッセージを投稿してみよう！
        </p>
        {% endif %}
      </div>
    </div>
    <!-- jsファイル読み込み-->
    <script src="{{ url_for('static', filename='script.js')}}"></script>
  </body>
</html>
