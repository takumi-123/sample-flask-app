<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプル掲示板</title>
    <!-- CSSの読み込み -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>💬 掲示板アプリ</h1>

      <!-- 投稿フォーム(POSTから送信されたら-->
      <form action="/" method="POST" class="post-form">
        <textarea
          name="message"
          placeholder="いまどうしてる？メッセージを入力..."
          required
        ></textarea>
        <button type="submit">投稿する</button>
      </form>

      <!-- 投稿一覧 -->
      <div class="message-list">
        <h2>投稿一覧</h2>
        {% if rows %}
        <ul>
          {% for row in rows %}
          <li class="message-card">
            <span>{{ row[1] }}</span>
            <!-- 編集ボタン-->
            <a
              href="/edit/{{ row[0] }}"
              class="edit-btn"
              style="margin-right: 5px"
              >編集</a
            >
            <!-- 削除ボタン（row[0] の id を使って削除ルートに飛ばす） -->
            <form
              action="/delete/{{ row[0] }}"
              method="POST"
              style="display: inline"
            >
              <button type="submit" class="delete-btn">削除</button>
            </form>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="no-message">
          まだ投稿はありません。最初のメッセージを投稿してみよう！
        </p>
        {% endif %}
      </div>
    </div>
  </body>
</html>
