<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Todoアプリ - ログイン</title>
  </head>
  <body>
    <div class="container">
      <h2>Todoアプリ ログイン</h2>

      <form action="/todo/login" method="POST">
        <div class="form-group">
          <label>ユーザー名：</label>
          <input
            type="text"
            name="username"
            placeholder="ユーザー名"
            required
          />
        </div>

        <div class="form-group">
          <label>パスワード：</label>
          <input type="password" name="password" required />
        </div>

        <button type="submit">ログイン</button>
      </form>

      <p>
        アカウントをお持ちでない方はこちら：<a href="/todo/register"
          >新規登録はこちら</a
        >
      </p>
    </div>
  </body>
</html>
